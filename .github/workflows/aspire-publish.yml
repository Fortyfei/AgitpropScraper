name: Build and Push Images

on:
  push:
    branches: [main]
  # Any base branch, so stacked pull requests are verified too. The publish and push
  # jobs are gated on the push event, so this only adds the test jobs.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run deterministic tests
        run: |
          dotnet test Agitprop.Sinks.Newsfeed_Test/Agitprop.Sinks.Newsfeed_Test.csproj --configuration Release
          dotnet test Agitprop.UnitTests/Agitprop.UnitTests.csproj --configuration Release

  integration-tests:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run Aspire integration tests
        run: dotnet test Agitprop.IntegrationTests/Agitprop.IntegrationTests.csproj --configuration Release

  publish-deployment:
    if: github.event_name == 'push'
    needs: [test, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> $GITHUB_PATH

      - name: Generate deployment artifacts
        run: aspire publish --output-path artifacts --non-interactive

      - name: Fill image names and ports
        run: |
          sed -i 's|^CONSUMER_IMAGE=.*|CONSUMER_IMAGE=ghcr.io/fortyfei/agitprop/consumer:latest|' artifacts/.env
          sed -i 's|^RSS_FEED_READER_IMAGE=.*|RSS_FEED_READER_IMAGE=ghcr.io/fortyfei/agitprop/rss-feed-reader:latest|' artifacts/.env
          sed -i 's|^WEB_IMAGE=.*|WEB_IMAGE=ghcr.io/fortyfei/agitprop/web:latest|' artifacts/.env

      - name: Show generated files
        run: ls -la artifacts

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agitprop-deploy
          path: artifacts
          if-no-files-found: error

  build-and-push:
    if: github.event_name == 'push'
    needs: [test, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> $GITHUB_PATH

      - name: Output Aspire CLI version
        run: aspire --version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          REGISTRY_ENDPOINT: ghcr.io
          REGISTRY_REPOSITORY: ${{ github.repository }}
        run: aspire do push --log-level trace
