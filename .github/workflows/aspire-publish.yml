name: Build and Push Images

on:
  push:
    branches: [main]
  # Any base branch, so stacked pull requests are verified too. The publish and push
  # jobs are gated on the push event, so this only adds the test jobs.
  pull_request:

env:
  # Keep in sync with Aspire.AppHost.Sdk in Agitprop.AppHost/Agitprop.AppHost.csproj.
  ASPIRE_CLI_VERSION: 13.6.5

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run deterministic tests
        run: |
          dotnet test Agitprop.Sinks.Newsfeed_Test/Agitprop.Sinks.Newsfeed_Test.csproj --configuration Release
          dotnet test Agitprop.UnitTests/Agitprop.UnitTests.csproj --configuration Release

  integration-tests:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run Aspire integration tests
        run: dotnet test Agitprop.IntegrationTests/Agitprop.IntegrationTests.csproj --configuration Release

  publish-deployment:
    if: github.event_name == 'push'
    # The artifact pins image tags to this commit, so it must not exist before the images it
    # references have been pushed.
    needs: [test, integration-tests, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire CLI
        run: |
          dotnet tool install --global Aspire.Cli --version ${{ env.ASPIRE_CLI_VERSION }}
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate deployment artifacts
        run: aspire publish --output-path artifacts --non-interactive

      - name: Copy the database bootstrap script into the bundle
        run: cp -r Agitprop.AppHost/postgres-init artifacts/postgres-init

      - name: Point the bundle at the moving tag
        run: |
          sed -i "s|^CONSUMER_IMAGE=.*|CONSUMER_IMAGE=ghcr.io/fortyfei/agitprop/consumer:stable|" artifacts/.env
          sed -i "s|^RSS_FEED_READER_IMAGE=.*|RSS_FEED_READER_IMAGE=ghcr.io/fortyfei/agitprop/rss-feed-reader:stable|" artifacts/.env
          sed -i "s|^WEB_IMAGE=.*|WEB_IMAGE=ghcr.io/fortyfei/agitprop/web:stable|" artifacts/.env
          sed -i "s|^POSTGRES_BINDMOUNT_0=.*|POSTGRES_BINDMOUNT_0=./postgres-init|" artifacts/.env
          sed -i "s|^WATCHTOWER_BINDMOUNT_0=.*|WATCHTOWER_BINDMOUNT_0=/opt/agitprop/docker-config|" artifacts/.env
          echo "${GITHUB_SHA}" > artifacts/.build-sha

      - name: Show generated files
        run: ls -la artifacts

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agitprop-deploy
          path: artifacts
          if-no-files-found: error

  build-and-push:
    if: github.event_name == 'push'
    needs: [test, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire CLI
        run: |
          dotnet tool install --global Aspire.Cli --version ${{ env.ASPIRE_CLI_VERSION }}
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Output Aspire CLI version
        run: aspire --version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          REGISTRY_ENDPOINT: ghcr.io
          REGISTRY_REPOSITORY: ${{ github.repository }}
        run: aspire do push --log-level trace

      # Watchtower follows a tag, not a commit: move "stable" onto the images built here so every
      # host pulling "stable" picks this merge up within one poll interval. The commit tags stay
      # in place as the pin and rollback targets.
      - name: Move the stable tag onto this build
        run: |
          for image in consumer rss-feed-reader web; do
            docker buildx imagetools create \
              --tag "ghcr.io/fortyfei/agitprop/${image}:stable" \
              "ghcr.io/fortyfei/agitprop/${image}:${GITHUB_SHA}"
          done
