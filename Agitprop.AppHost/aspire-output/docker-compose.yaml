services:
  agitprop-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "18888:18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  messaging:
    image: "docker.io/library/rabbitmq:4.2-management"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "${MESSAGING_PASSWORD}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://agitprop-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "messaging"
    ports:
      - "15672:15672"
      - "5672:5672"
    expose:
      - "5672"
    networks:
      - "aspire"
  postgres:
    image: "docker.io/library/postgres:17.6"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://agitprop-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "postgres"
    ports:
      - "5432:5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql/data"
        source: "agitprop.apphost-b10370b750-postgres-data"
        read_only: false
    networks:
      - "aspire"
  consumer:
    image: "${CONSUMER_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ConnectionStrings__newsfeed: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=newsfeed"
      NEWSFEED_HOST: "postgres"
      NEWSFEED_PORT: "5432"
      NEWSFEED_USERNAME: "postgres"
      NEWSFEED_PASSWORD: "${POSTGRES_PASSWORD}"
      NEWSFEED_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/newsfeed"
      NEWSFEED_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/newsfeed"
      NEWSFEED_DATABASENAME: "newsfeed"
      ConnectionStrings__messaging: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      MESSAGING_HOST: "messaging"
      MESSAGING_PORT: "5672"
      MESSAGING_USERNAME: "guest"
      MESSAGING_PASSWORD: "${MESSAGING_PASSWORD}"
      MESSAGING_URI: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://agitprop-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "consumer"
    depends_on:
      postgres:
        condition: "service_started"
      messaging:
        condition: "service_started"
    networks:
      - "aspire"
  rssReader:
    image: "${RSS_FEED_READER_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ConnectionStrings__messaging: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      MESSAGING_HOST: "messaging"
      MESSAGING_PORT: "5672"
      MESSAGING_USERNAME: "guest"
      MESSAGING_PASSWORD: "${MESSAGING_PASSWORD}"
      MESSAGING_URI: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://agitprop-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "rss-feed-reader"
    depends_on:
      messaging:
        condition: "service_started"
      consumer:
        condition: "service_started"
    networks:
      - "aspire"
  backend:
    image: "${BACKEND_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${BACKEND_PORT}"
      ConnectionStrings__newsfeed: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=newsfeed"
      NEWSFEED_HOST: "postgres"
      NEWSFEED_PORT: "5432"
      NEWSFEED_USERNAME: "postgres"
      NEWSFEED_PASSWORD: "${POSTGRES_PASSWORD}"
      NEWSFEED_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/newsfeed"
      NEWSFEED_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/newsfeed"
      NEWSFEED_DATABASENAME: "newsfeed"
      ConnectionStrings__messaging: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      MESSAGING_HOST: "messaging"
      MESSAGING_PORT: "5672"
      MESSAGING_USERNAME: "guest"
      MESSAGING_PASSWORD: "${MESSAGING_PASSWORD}"
      MESSAGING_URI: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://agitprop-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "backend"
    expose:
      - "${BACKEND_PORT}"
    depends_on:
      postgres:
        condition: "service_started"
      messaging:
        condition: "service_started"
    networks:
      - "aspire"
  frontend:
    image: "${FRONTEND_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${FRONTEND_PORT}"
      BACKEND_HTTP: "http://backend:${BACKEND_PORT}"
      services__backend__http__0: "http://backend:${BACKEND_PORT}"
      BACKEND_HTTPS: "https://backend:${BACKEND_PORT}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://agitprop-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "frontend"
    ports:
      - "${FRONTEND_PORT}"
    depends_on:
      backend:
        condition: "service_started"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  agitprop.apphost-b10370b750-postgres-data:
    driver: "local"
